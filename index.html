<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puer Aeternus Bingo</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%22-.15em%22 y=%22.9em%22 font-size=%2290%22>🎭</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            padding-top: 76px;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 56px;
            background: rgba(22, 32, 42, 0.97);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 10px;
            z-index: 300;
            box-shadow: 0 2px 16px rgba(0,0,0,0.5);
        }

        .top-bar-title {
            color: white;
            font-size: 17px;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .top-bar-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        /* ===== TOP BAR CONTROLS - unified family ===== */

        /* Shared base for all interactive top-bar elements */
        .control-btn,
        .shuffle-btn,
        .settings-toggle-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 36px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            flex-shrink: 0;
            user-select: none;
            white-space: nowrap;
        }

        .control-btn:hover,
        .shuffle-btn:hover,
        .settings-toggle-btn:hover {
            background: rgba(255,255,255,0.16);
            border-color: rgba(255,255,255,0.28);
        }

        .control-btn:active,
        .shuffle-btn:active,
        .settings-toggle-btn:active {
            background: rgba(255,255,255,0.22);
        }

        /* Item count segmented control — one visual unit */
        .item-count-control {
            display: flex;
            align-items: center;
            height: 36px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 8px;
            overflow: hidden;
        }

        /* ± buttons inside the segmented control */
        .item-count-control .control-btn {
            width: 32px;
            height: 100%;
            border: none;
            border-radius: 0;
            background: transparent;
            font-size: 20px;
            font-weight: 300;
            line-height: 1;
        }

        .item-count-control .control-btn:hover {
            background: rgba(255,255,255,0.14);
            border-color: transparent;
        }

        .item-count-control .control-btn:first-child {
            border-right: 1px solid rgba(255,255,255,0.12);
        }

        .item-count-control .control-btn:last-child {
            border-left: 1px solid rgba(255,255,255,0.12);
        }

        .item-count {
            font-size: 14px;
            font-weight: 700;
            color: rgba(255,255,255,0.9);
            min-width: 32px;
            text-align: center;
            letter-spacing: 0.02em;
        }

        /* Shuffle — a bit wider for the label */
        .shuffle-btn {
            gap: 6px;
            padding: 0 13px;
            font-size: 13px;
            font-weight: 600;
        }

        /* Settings gear */
        .settings-toggle-btn {
            width: 36px;
            font-size: 16px;
        }

        .settings-toggle-btn.active {
            background: rgba(52, 152, 219, 0.25);
            border-color: rgba(52, 152, 219, 0.6);
        }

        /* Icons toggle pill */
        .icons-toggle-pill {
            display: flex;
            align-items: center;
            gap: 7px;
            height: 36px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 8px;
            padding: 0 10px 0 10px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            user-select: none;
            flex-shrink: 0;
        }

        .icons-toggle-pill:hover {
            background: rgba(255,255,255,0.16);
            border-color: rgba(255,255,255,0.28);
        }

        .icons-toggle-pill .pill-label {
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .icons-toggle-pill.active .pill-label {
            color: rgba(255,255,255,0.9);
        }

        .icons-toggle-pill .mini-track {
            position: relative;
            width: 34px;
            height: 20px;
            background: rgba(255,255,255,0.12);
            border-radius: 20px;
            transition: background 0.25s;
            flex-shrink: 0;
        }

        .icons-toggle-pill .mini-track::before {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            left: 3px;
            top: 3px;
            background: rgba(255,255,255,0.55);
            border-radius: 50%;
            transition: transform 0.25s, background 0.25s;
        }

        .icons-toggle-pill.active .mini-track {
            background: #27ae60;
        }

        .icons-toggle-pill.active .mini-track::before {
            transform: translateX(14px);
            background: white;
        }

        /* ===== SETTINGS BACKDROP ===== */
        .settings-backdrop {
            position: fixed;
            top: 56px;
            left: 0; right: 0; bottom: 0;
            background: transparent;
            z-index: 150;
            pointer-events: none;
        }

        .settings-backdrop.open {
            pointer-events: all;
        }

        /* ===== SETTINGS PANEL ===== */
        .settings-panel {
            position: fixed;
            top: 56px;
            right: 0;
            bottom: 0;
            width: 380px;
            max-width: 100vw;
            background: #18242f;
            z-index: 200;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .settings-panel.open {
            transform: translateX(0);
            box-shadow: -8px 0 40px 4px rgba(0, 0, 0, 0.7), -2px 0 12px rgba(0, 0, 0, 0.5);
        }

        .settings-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            height: 56px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .settings-panel-header h2 {
            color: white;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.03em;
        }

        /* ===== TABS ===== */
        .settings-tabs {
            display: flex;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .settings-tabs::-webkit-scrollbar {
            display: none;
        }

        .settings-tab-btn {
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: rgba(255, 255, 255, 0.4);
            padding: 11px 16px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            flex-shrink: 0;
        }

        .settings-tab-btn:hover {
            color: rgba(255, 255, 255, 0.75);
            background: rgba(255, 255, 255, 0.04);
        }

        .settings-tab-btn.active {
            color: #3498db;
            border-bottom-color: #3498db;
        }

        /* ===== SETTINGS CONTENT ===== */
        .settings-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px 24px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.15) transparent;
        }

        .settings-content::-webkit-scrollbar {
            width: 4px;
        }

        .settings-content::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 4px;
        }

        .settings-fields {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .settings-field {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 10px;
            border-radius: 8px;
            gap: 12px;
            transition: background 0.15s;
        }

        .settings-field:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .field-label {
            color: rgba(255, 255, 255, 0.75);
            font-size: 13px;
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .field-hint {
            color: rgba(255, 255, 255, 0.28);
            font-size: 11px;
            font-family: monospace;
            flex-shrink: 0;
        }

        .field-input {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
            padding: 5px 8px;
            width: 86px;
            text-align: right;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .field-input.string-input {
            width: 140px;
            text-align: left;
        }

        .field-input:hover {
            border-color: rgba(255, 255, 255, 0.25);
        }

        .field-input:focus {
            outline: none;
            border-color: #3498db;
            background: rgba(52, 152, 219, 0.12);
        }

        /* ===== TOGGLE SWITCH ===== */
        .toggle-label {
            position: relative;
            display: inline-block;
            width: 42px;
            height: 24px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .toggle-label input {
            opacity: 0;
            width: 0;
            height: 0;
            position: absolute;
        }

        .toggle-track {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            transition: background 0.25s;
        }

        .toggle-track::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            left: 3px;
            top: 3px;
            background: rgba(255,255,255,0.7);
            border-radius: 50%;
            transition: transform 0.25s, background 0.25s;
        }

        .toggle-label input:checked + .toggle-track {
            background: #27ae60;
        }

        .toggle-label input:checked + .toggle-track::before {
            transform: translateX(18px);
            background: white;
        }

        /* ===== SLIDER CONTROL ===== */
        .slider-control {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .slider-input {
            -webkit-appearance: none;
            appearance: none;
            width: 100px;
            height: 4px;
            border-radius: 4px;
            background: rgba(255,255,255,0.15);
            outline: none;
            cursor: pointer;
            flex-shrink: 0;
        }

        .slider-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #3498db;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }

        .slider-input::-webkit-slider-thumb:hover {
            background: #5dade2;
            transform: scale(1.2);
        }

        .slider-input::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border: none;
            border-radius: 50%;
            background: #3498db;
            cursor: pointer;
        }

        .slider-value {
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            min-width: 36px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* ===== SETTINGS NOTE ===== */
        .settings-note {
            color: rgba(255, 255, 255, 0.25);
            font-size: 11px;
            text-align: center;
            margin-top: 20px;
            padding: 10px 16px;
            border-top: 1px solid rgba(255,255,255,0.06);
            font-style: italic;
            line-height: 1.5;
        }

        /* ===== BINGO BOARD ===== */
        .bingo-container {
            display: grid;
            gap: 10px;
            max-width: 800px;
            min-width: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            position: relative;
        }

        .bingo-tile {
            aspect-ratio: 1;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            user-select: none;
            position: relative;
            min-width: 0;
            min-height: 0;
            perspective: 1000px;
        }

        .tile-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform var(--flip-duration);
            transform-style: preserve-3d;
        }

        .bingo-tile.marked .tile-inner {
            transform: rotateY(180deg);
        }

        .tile-front, .tile-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            word-wrap: break-word;
            overflow: hidden;
        }

        .tile-front {
            background: white;
            border: 3px solid #3498db;
            color: #333;
        }

        .tile-back {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
            border: 3px solid #229954;
            color: white;
            transform: rotateY(180deg);
        }

        .tile-back::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: var(--icon-window-height);
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.1);
            border-radius: 7px 7px 0 0;
            z-index: 0;
            pointer-events: none;
            display: var(--icon-band-display);
        }

        .tile-emoji {
            position: absolute;
            top: var(--icon-top-offset);
            left: 0;
            right: 0;
            height: var(--icon-window-height);
            display: var(--icon-display);
            align-items: center;
            justify-content: center;
            font-size: var(--icon-size);
            opacity: 1;
            text-shadow:
                0 var(--shadow-offset-y) var(--shadow-blur-1) rgba(0, 0, 0, var(--shadow-opacity)),
                0 var(--shadow-offset-y) var(--shadow-blur-2) rgba(0, 0, 0, var(--shadow-opacity)),
                0 var(--shadow-offset-y) var(--shadow-blur-3) rgba(0, 0, 0, var(--shadow-opacity));
            pointer-events: none;
            user-select: none;
            z-index: 1;
        }

        .tile-text {
            position: absolute;
            top: calc(50% + var(--text-top-offset));
            left: 0;
            right: 0;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-family: var(--text-font);
            z-index: 2;
        }

        .tile-back .tile-text {
            text-shadow: 0 0 var(--text-shadow-blur) rgba(0, 0, 0, var(--text-shadow-opacity));
        }

        .tile-front .tile-text {
            position: absolute;
            top: calc(50% + var(--text-top-offset));
            left: 0;
            right: 0;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-family: var(--text-font);
        }

        .bingo-tile.empty .tile-front,
        .bingo-tile.empty .tile-back {
            background: #7c8894;
            border: 3px dashed #5b6a75;
        }

        .bingo-tile.placeholder {
            pointer-events: none;
        }

        .bingo-tile.placeholder .tile-inner {
            background: transparent;
            border-radius: 10px;
            border: none;
        }

        .bingo-tile:not(.empty):hover .tile-inner {
            transform: rotateY(15deg);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
        }

        .bingo-tile.marked:not(.empty):hover .tile-inner {
            transform: rotateY(165deg);
        }

        @keyframes spiralIn {
            0% {
                transform: scale(0) rotate(-360deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .bingo-tile.spiral-in .tile-inner {
            animation: spiralIn var(--spiral-in-duration) ease-out;
        }

        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 1000;
        }

        .particle.chaos {
            background: var(--particle-color);
            box-shadow: 0 0 3px var(--particle-glow);
        }

        @keyframes violentDestruction {
            0% {
                transform: translate(var(--start-x), var(--start-y))
                           scale(var(--start-scale))
                           rotateX(var(--rot-x-start))
                           rotateY(var(--rot-y-start))
                           rotateZ(var(--rot-z-start));
                opacity: var(--start-opacity);
            }
            100% {
                transform: translate(var(--end-x), var(--end-y))
                           scale(0)
                           rotateX(var(--rot-x-end))
                           rotateY(var(--rot-y-end))
                           rotateZ(var(--rot-z-end));
                opacity: 0;
            }
        }

        .particle.chaos {
            animation: violentDestruction var(--particle-duration) var(--particle-easing) forwards;
            will-change: transform, opacity;
            backface-visibility: hidden;
        }

        .card-fragment {
            pointer-events: none;
            z-index: 1000;
            will-change: transform, opacity;
            backface-visibility: hidden;
        }

        .tile-back::before {
            content: '✓';
            position: absolute;
            top: 4px;
            right: 4px;
            width: 20px;
            height: 20px;
            background: rgba(70, 70, 70, 0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }

        .line-number {
            position: absolute;
            bottom: 3px;
            left: 3px;
            min-width: 28px;
            background: rgba(70, 70, 70, 0.25);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px 6px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 12px;
            font-weight: normal;
            font-family: monospace;
        }

        /* ===== MOBILE ===== */
        @media (max-width: 600px) {
            body {
                padding: 10px;
                padding-top: 68px;
            }

            .top-bar {
                height: 52px;
                padding: 0 10px;
                gap: 6px;
            }

            .top-bar-title {
                font-size: 14px;
            }

            .control-btn,
            .shuffle-btn,
            .settings-toggle-btn,
            .icons-toggle-pill,
            .item-count-control {
                height: 32px;
            }

            .settings-toggle-btn {
                width: 32px;
            }

            .shuffle-btn .shuffle-label {
                display: none;
            }

            .bingo-tile {
                font-size: 11px;
            }

            .tile-front, .tile-back {
                padding: 5px;
            }

            .bingo-container {
                gap: 5px;
                padding: 10px;
            }

            /* Bottom sheet on mobile */
            .settings-panel {
                top: auto;
                left: 0;
                right: 0;
                width: 100%;
                height: 75vh;
                border-radius: 16px 16px 0 0;
                transform: translateY(100%);
            }

            .settings-panel.open {
                transform: translateY(0);
                box-shadow: 0 -4px 32px rgba(0, 0, 0, 0.6);
            }
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="top-bar">
        <span class="top-bar-title">🎭 Puer Aeternus Bingo</span>
        <div class="top-bar-controls">
            <div class="item-count-control">
                <button class="control-btn" onclick="decreaseItems()">−</button>
                <span class="item-count" id="itemCount">25</span>
                <button class="control-btn" onclick="increaseItems()">+</button>
            </div>
            <button class="shuffle-btn" onclick="shuffleBoard()">
                <span>🔀</span><span class="shuffle-label">Shuffle</span>
            </button>
            <div class="icons-toggle-pill" id="iconsTogglePill" onclick="toggleIcons()">
                <span class="pill-label">Icons</span>
                <span class="mini-track"></span>
            </div>
            <button class="settings-toggle-btn" id="settingsToggleBtn" onclick="toggleSettings()" title="Settings">⚙️</button>
        </div>
    </div>

    <!-- SETTINGS BACKDROP -->
    <div class="settings-backdrop" id="settingsBackdrop" onclick="closeSettings()"></div>

    <!-- SETTINGS PANEL -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-panel-header">
            <h2>⚙️ Settings</h2>
        </div>
        <div class="settings-tabs" id="settingsTabs"></div>
        <div class="settings-content" id="settingsContent"></div>
    </div>

    <!-- BOARD -->
    <div class="bingo-container" id="bingoBoard"></div>

    <!-- PARTICLE SANDBOX -->
    <div id="particleSandbox" style="position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 180;"></div>

    <script>
        // ============================================================
        // MASTER CONFIGURATION
        // ============================================================
        const TIMINGS = {
            flipDuration: 600,
            minRipDuration: 1000,
            maxRipDuration: 1200,
            spiralInDuration: 500,
            flipbackWait: 300,
            maxStaggerDelay: 200,
            debounceDelay: 100,
            minPlaceholderDisplay: 500
        };

        const PARTICLE_CONFIG = {
            chaos: {
                count: 30,
                minSize: 4,
                maxSize: 8,
                minDuration: 500,
                maxDuration: 1050,
                maxStartDelay: 100,
                spawnRadiusMultiplier: 0.85,
                angleVariationRad: 0.8,
                overshootMinMult: 0.5,
                overshootMaxMult: 4,
                rotationMin: -720,
                rotationMax: 720,
                startScaleMin: 0.7,
                startScaleMax: 1.3,
                startOpacityMin: 0.7,
                startOpacityMax: 1.0,
                colors: [
                    { bg: 'rgba(20, 20, 35, 0.9)',  glow: 'rgba(40, 40, 80, 0.5)'  },
                    { bg: 'rgba(30, 25, 40, 0.85)', glow: 'rgba(50, 40, 70, 0.4)'  },
                    { bg: 'rgba(15, 15, 25, 0.95)', glow: 'rgba(30, 30, 50, 0.6)'  },

                    const scale    = field.type === 'percent' ? 100 : 1;

                    const dispVal  = Math.round(value * scale * 100) / 100;
                    const step     = field.type === 'percent' ? '0.1' : '1';
                    html += `<div class="slider-control">

        // ============================================================
        // UTILITY FUNCTIONS
        // ============================================================
        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getNextSquare(num) {
            const sqrt = Math.ceil(Math.sqrt(num));
            return sqrt * sqrt;
        }

        function calculateStaggerDelay(index, totalTiles) {
            return Math.floor(((index + 1) / totalTiles) * TIMINGS.maxStaggerDelay);
        }

        function randomInRange(min, max) {
            return min + Math.random() * (max - min);
        }

        function pointsToPolygon(points) {
            return `polygon(${points.map(p => `${p.x}% ${p.y}%`).join(', ')})`;
        }

        function rotatePoint(point, angleDeg, cardCenterX = 50, cardCenterY = 50) {
            const angleRad = (angleDeg * Math.PI) / 180;
            const cos = Math.cos(angleRad);
            const sin = Math.sin(angleRad);
            const x = point.x - cardCenterX;
            const y = point.y - cardCenterY;
            const xRot = x * cos - y * sin;
            const yRot = x * sin + y * cos;
            return { x: xRot + cardCenterX, y: yRot + cardCenterY };
        }

        function calculatePolygonCentroid(points) {
            if (points.length < 3) return { x: 50, y: 50 };
            let area = 0, cx = 0, cy = 0;
            for (let i = 0; i < points.length; i++) {
                const j = (i + 1) % points.length;
                const cross = points[i].x * points[j].y - points[j].x * points[i].y;
                area += cross;
                cx += (points[i].x + points[j].x) * cross;
                cy += (points[i].y + points[j].y) * cross;
            }
            area *= 0.5;
            cx /= (6 * area);
            cy /= (6 * area);
            return { x: cx, y: cy };
        }

        function roughenEdges(points) {
            const config = RIP_CONFIG.edgeRoughness;
            if (config.extraPointsPerEdge < 1) return points;
            const roughPoints = [];
            for (let i = 0; i < points.length; i++) {
                const current = points[i];
                const next = points[(i + 1) % points.length];
                roughPoints.push(current);
                for (let j = 1; j <= config.extraPointsPerEdge; j++) {
                    const t = j / (config.extraPointsPerEdge + 1);
                    const interpX = current.x + (next.x - current.x) * t;
                    const interpY = current.y + (next.y - current.y) * t;
                    const dx = next.x - current.x;
                    const dy = next.y - current.y;
                    const len = Math.sqrt(dx * dx + dy * dy);
                    if (len > 0) {
                        const perpX = -dy / len;
                        const perpY = dx / len;
                        const offset = randomInRange(-config.maxDeviationPx, config.maxDeviationPx);
                        roughPoints.push({ x: interpX + (perpX * offset), y: interpY + (perpY * offset) });
                    }
                }
            }
            return roughPoints;
        }

        // ============================================================
        // CARD RIPPING EFFECT
        // ============================================================
        function createCardRip(tile) {
            const rect = tile.getBoundingClientRect();
            const sandbox = document.getElementById('particleSandbox');
            const isFlipped = tile.classList.contains('marked');
            const sourceElement = isFlipped ? tile.querySelector('.tile-back') : tile.querySelector('.tile-front');
            if (!sourceElement) return;
            tile.style.opacity = '0';
            const fragmentGeometry = generateFragmentGeometry();
            const fragments = fragmentGeometry.map(({ points }) => {
                const fragment = createFragment(sourceElement, rect, isFlipped);
                const roughPoints = roughenEdges(points);
                fragment.style.clipPath = pointsToPolygon(roughPoints);
                return fragment;
            });
            const cardCenterX = rect.left + rect.width / 2;
            const cardCenterY = rect.top + rect.height / 2;
            fragmentGeometry.forEach(({ centroid }, index) => {
                const fragment = fragments[index];
                const { keyframes, duration } = animateVortex(fragment, rect, centroid, cardCenterX, cardCenterY);
                sandbox.appendChild(fragment);
                requestAnimationFrame(() => {
                    fragment.animate(keyframes, {
                        duration: duration,
                        easing: 'cubic-bezier(0.25, 0.1, 0.25, 1)',
                        fill: 'forwards'
                    });
                });
            });
            setTimeout(() => { fragments.forEach(f => f.remove()); }, TIMINGS.maxRipDuration);
        }

        function generateFragmentGeometry() {
            const jitter = RIP_CONFIG.jitter;
            const rotations = [0, 90, 180, 270];
            const rotation = rotations[Math.floor(Math.random() * rotations.length)];
            const tlX = randomInRange(-jitter, jitter);
            const tlY = randomInRange(-jitter, jitter);
            const trX = 100 + randomInRange(-jitter, jitter);
            const trY = randomInRange(-jitter, jitter);
            const ripCenterX = 50 + randomInRange(-jitter, jitter);
            const ripCenterY = 66.666 + randomInRange(-jitter, jitter);
            const bcX = 50 + randomInRange(-jitter, jitter);
            const bcY = 100;
            const f1 = [
                { x: 0, y: 0 }, { x: tlX, y: tlY }, { x: ripCenterX, y: ripCenterY }, { x: bcX, y: bcY }, { x: 0, y: 100 }
            ].map(p => rotatePoint(p, rotation));
            const f2 = [
                { x: ripCenterX, y: ripCenterY }, { x: trX, y: trY }, { x: 100, y: 0 }, { x: 100, y: 100 }, { x: bcX, y: bcY }
            ].map(p => rotatePoint(p, rotation));
            const f3 = [
                { x: 0, y: 0 }, { x: tlX, y: tlY }, { x: ripCenterX, y: ripCenterY }, { x: trX, y: trY }, { x: 100, y: 0 }
            ].map(p => rotatePoint(p, rotation));
            return [
                { points: f1, centroid: calculatePolygonCentroid(f1) },
                { points: f2, centroid: calculatePolygonCentroid(f2) },
                { points: f3, centroid: calculatePolygonCentroid(f3) }
            ];
        }

        function animateVortex(fragment, rect, centroid, cardCenterX, cardCenterY) {
            const vortex = RIP_CONFIG.vortex;
            const fragmentDuration = randomInRange(TIMINGS.minRipDuration, TIMINGS.maxRipDuration);
            const durationInSeconds = fragmentDuration / 1000;
            fragment.style.transformOrigin = `${centroid.x}% ${centroid.y}%`;
            const fragmentCenterX = rect.left + (rect.width * centroid.x / 100);
            const fragmentCenterY = rect.top + (rect.height * centroid.y / 100);
            const toCenterX = cardCenterX - fragmentCenterX;
            const toCenterY = cardCenterY - fragmentCenterY;
            const distance = Math.sqrt(toCenterX * toCenterX + toCenterY * toCenterY);
            const startAngle = Math.atan2(-toCenterY, -toCenterX);
            const orbitalSpeed = randomInRange(vortex.orbitalSpeedMin, vortex.orbitalSpeedMax)
                               + randomInRange(-vortex.fragmentOrbitVariation, vortex.fragmentOrbitVariation);
            const totalRotation = orbitalSpeed * durationInSeconds * Math.PI * 2 * vortex.spiralDirection;
            const finalDistance = distance * vortex.centerGapPercent;
            const naturalRotationSpeed = orbitalSpeed * 360 * vortex.spiralDirection;
            const relativeRotationSpeed = randomInRange(vortex.relativeRotationSpeedMin, vortex.relativeRotationSpeedMax)
                                        + randomInRange(-vortex.fragmentRotationVariation, vortex.fragmentRotationVariation);
            const totalFragmentSpin = (naturalRotationSpeed + relativeRotationSpeed) * durationInSeconds;
            const keyframes = [];
            const easeIn = (t) => Math.pow(t, vortex.easePower);
            for (let i = 0; i <= vortex.spiralKeyframes; i++) {
                const t = i / vortex.spiralKeyframes;
                const te = easeIn(t);
                const currentDistance = distance - (distance - finalDistance) * te;
                const currentAngle = startAngle + totalRotation * te;
                const x = Math.cos(currentAngle) * currentDistance + toCenterX;
                const y = Math.sin(currentAngle) * currentDistance + toCenterY;
                const currentRotation = totalFragmentSpin * te;
                const currentScale = 1 - te;
                let currentOpacity = 1;
                if (te > vortex.opacityStart) {
                    currentOpacity = 1 - (te - vortex.opacityStart) / (1 - vortex.opacityStart);
                }
                keyframes.push({
                    transform: `translate(${x}px, ${y}px) rotate(${currentRotation}deg) scale(${currentScale})`,
                    opacity: currentOpacity
                });
            }
            return { keyframes, duration: fragmentDuration };
        }

        function createFragment(sourceElement, rect) {
            const fragment = document.createElement('div');
            fragment.className = 'card-fragment';
            const cs = window.getComputedStyle(sourceElement);
            fragment.style.position = 'absolute';
            fragment.style.left = rect.left + 'px';
            fragment.style.top = rect.top + 'px';
            fragment.style.width = rect.width + 'px';
            fragment.style.height = rect.height + 'px';
            fragment.style.background = cs.background;
            fragment.style.border = cs.border;
            fragment.style.borderRadius = cs.borderRadius;
            fragment.style.color = cs.color;
            fragment.style.fontSize = cs.fontSize;
            fragment.style.fontWeight = cs.fontWeight;
            fragment.style.display = 'flex';
            fragment.style.alignItems = 'center';
            fragment.style.justifyContent = 'center';
            fragment.style.textAlign = 'center';
            fragment.style.padding = cs.padding;
            const textEl = sourceElement.querySelector('.tile-text');
            if (textEl) { fragment.textContent = textEl.textContent; }
            return fragment;
        }

        // ============================================================
        // CHAOTIC DESTRUCTION PARTICLES
        // ============================================================
        function createChaoticDestruction(tile) {
            const rect = tile.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const tileSize = Math.min(rect.width, rect.height);
            const config = PARTICLE_CONFIG.chaos;
            const particles = [];
            const spawnRadius = tileSize * config.spawnRadiusMultiplier;
            const sandbox = document.getElementById('particleSandbox');
            const maxParticleLifetime = config.maxStartDelay + config.maxDuration;
            for (let i = 0; i < config.count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle chaos';
                const size = randomInRange(config.minSize, config.maxSize);
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                const colorData = config.colors[Math.floor(Math.random() * config.colors.length)];
                particle.style.setProperty('--particle-color', colorData.bg);
                particle.style.setProperty('--particle-glow', colorData.glow);
                const angle = Math.random() * Math.PI * 2;
                const spawnDist = spawnRadius * randomInRange(0.3, 1.0);
                const startX = Math.cos(angle) * spawnDist;
                const startY = Math.sin(angle) * spawnDist;
                const targetAngle = angle + (Math.random() - 0.5) * Math.PI * config.angleVariationRad;
                const endDist = -spawnDist * randomInRange(config.overshootMinMult, config.overshootMaxMult);
                const endX = Math.cos(targetAngle) * endDist;
                const endY = Math.sin(targetAngle) * endDist;
                const rotXStart = Math.random() * 360;
                const rotYStart = Math.random() * 360;
                const rotZStart = Math.random() * 360;
                particle.style.left = `${centerX}px`;
                particle.style.top = `${centerY}px`;
                particle.style.setProperty('--start-x', `${startX}px`);
                particle.style.setProperty('--start-y', `${startY}px`);
                particle.style.setProperty('--end-x', `${endX}px`);
                particle.style.setProperty('--end-y', `${endY}px`);
                particle.style.setProperty('--rot-x-start', `${rotXStart}deg`);
                particle.style.setProperty('--rot-y-start', `${rotYStart}deg`);
                particle.style.setProperty('--rot-z-start', `${rotZStart}deg`);
                particle.style.setProperty('--rot-x-end', `${rotXStart + randomInRange(config.rotationMin, config.rotationMax)}deg`);
                particle.style.setProperty('--rot-y-end', `${rotYStart + randomInRange(config.rotationMin, config.rotationMax)}deg`);
                particle.style.setProperty('--rot-z-end', `${rotZStart + randomInRange(config.rotationMin, config.rotationMax)}deg`);
                particle.style.setProperty('--start-scale', randomInRange(config.startScaleMin, config.startScaleMax));
                particle.style.setProperty('--start-opacity', randomInRange(config.startOpacityMin, config.startOpacityMax));
                particle.style.setProperty('--particle-duration', `${randomInRange(config.minDuration, config.maxDuration)}ms`);
                particle.style.setProperty('--particle-easing', config.easingFunctions[Math.floor(Math.random() * config.easingFunctions.length)]);
                particle.style.animationDelay = `${Math.random() * config.maxStartDelay}ms`;
                sandbox.appendChild(particle);
                particles.push(particle);
            }
            setTimeout(() => { particles.forEach(p => p.remove()); }, maxParticleLifetime);
        }

        // ============================================================
        // USER INTERACTION HANDLERS
        // ============================================================
        function increaseItems() {
            if (currentItemCount < availableItems.length) {
                currentItemCount++;
                document.getElementById('itemCount').textContent = currentItemCount;
                debouncedRefresh();
            }
        }

        function decreaseItems() {
            if (currentItemCount > 1) {
                currentItemCount--;
                document.getElementById('itemCount').textContent = currentItemCount;
                debouncedRefresh();
            }
        }

        function shuffleBoard() { refreshBoard(); }

        function debouncedRefresh() {
            if (rebuildTimeout) clearTimeout(rebuildTimeout);
            rebuildTimeout = setTimeout(() => { refreshBoard(); }, TIMINGS.debounceDelay);
        }

        // ============================================================
        // BOARD REFRESH ANIMATION SEQUENCE
        // ============================================================
        function refreshBoard() {
            if (isBuilding) return;
            isBuilding = true;
            const board = document.getElementById('bingoBoard');
            const tiles = board.querySelectorAll('.bingo-tile');
            let hadFlippedCards = false;
            tiles.forEach(tile => {
                if (tile.classList.contains('marked')) {
                    hadFlippedCards = true;
                    tile.classList.remove('marked');
                }
            });
            const flipBackDelay = hadFlippedCards ? TIMINGS.flipbackWait : 0;
            setTimeout(() => {
                tiles.forEach((tile, index) => {
                    setTimeout(() => {
                        createCardRip(tile);
                        if (!tile.classList.contains('placeholder') && !tile.classList.contains('empty')) {
                            createChaoticDestruction(tile);
                        }
                    }, calculateStaggerDelay(index, tiles.length));
                });
            }, flipBackDelay);
            const lastTileDelay = calculateStaggerDelay(tiles.length - 1, tiles.length);
            const maxParticleLifetime = PARTICLE_CONFIG.chaos.maxStartDelay + PARTICLE_CONFIG.chaos.maxDuration;
            const totalWaitTime = flipBackDelay + lastTileDelay + Math.max(TIMINGS.maxRipDuration, maxParticleLifetime);
            setTimeout(() => {
                renderPlaceholders();
                requestAnimationFrame(() => { requestAnimationFrame(() => { populateBoard(); }); });
            }, totalWaitTime);
        }

        // ============================================================
        // BOARD RENDERING
        // ============================================================
        async function loadItemsOnce() {
            if (itemsLoadedOnce) return;

            let jsonData = DEFAULT_ITEMS;

            try {
                const response = await fetch('items.json');
                if (response.ok) {
                    const text = await response.text();
                    if (text.trim().length > 0) {
                        jsonData = text;
                    }
                }
            } catch (error) {
                // Use default
            }

            try {
                const parsed = JSON.parse(jsonData);
                availableItems = parsed.map((item, index) => ({
                    text: item[0], emoji: item[1], lineNumber: index + 1
                }));
            } catch (error) {
                console.error('Failed to parse items JSON:', error);
                availableItems = [];
            }

            itemsLoadedOnce = true;
            console.log(`Loaded ${availableItems.length} items`);
        }

        function renderPlaceholders() {
            const board = document.getElementById('bingoBoard');
            const targetSize = getNextSquare(currentItemCount);
            const gridSize = Math.sqrt(targetSize);
            board.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            board.innerHTML = '';
            for (let i = 0; i < targetSize; i++) {
                const tile = document.createElement('div');
                tile.className = 'bingo-tile placeholder';
                const inner = document.createElement('div');
                inner.className = 'tile-inner';
                tile.appendChild(inner);
                board.appendChild(tile);
            }
        }

        async function populateBoard() {
            const board = document.getElementById('bingoBoard');
            const minAnimTime = new Promise(resolve => setTimeout(resolve, TIMINGS.minPlaceholderDisplay));
            const itemsPromise = loadItemsOnce();
            await Promise.all([minAnimTime, itemsPromise]);

            if (currentItemCount > availableItems.length) currentItemCount = availableItems.length;
            document.getElementById('itemCount').textContent = currentItemCount;

            const allItems = availableItems.slice(0, currentItemCount);
            const targetSize = getNextSquare(allItems.length);
            const gridSize = Math.sqrt(targetSize);
            board.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;

            const items = [...allItems];
            while (items.length < targetSize) { items.push({ text: '', emoji: '', lineNumber: null }); }
            const shuffled = shuffle(items);

            const tiles = board.querySelectorAll('.bingo-tile');
            shuffled.forEach((item, index) => {
                if (!tiles[index]) return;
                const tile = tiles[index];
                tile.className = 'bingo-tile';

                const inner = document.createElement('div');
                inner.className = 'tile-inner';
                inner.style.transform = 'scale(0) rotate(-360deg)';
                inner.style.opacity = '0';

                const front = document.createElement('div');
                front.className = 'tile-front';
                const frontText = document.createElement('div');
                frontText.className = 'tile-text';
                frontText.textContent = item.text;
                front.appendChild(frontText);

                const back = document.createElement('div');
                back.className = 'tile-back';
                if (item.emoji) {
                    const emojiEl = document.createElement('div');
                    emojiEl.className = 'tile-emoji';
                    emojiEl.textContent = item.emoji;
                    back.appendChild(emojiEl);
                }
                const backText = document.createElement('div');
                backText.className = 'tile-text';
                backText.textContent = item.text;
                back.appendChild(backText);
                if (item.lineNumber) {
                    const lineNum = document.createElement('div');
                    lineNum.className = 'line-number';
                    lineNum.textContent = `#${item.lineNumber}`;
                    back.appendChild(lineNum);
                }

                inner.appendChild(front);
                inner.appendChild(back);
                tile.innerHTML = '';
                tile.appendChild(inner);

                if (item.text) {
                    tile.onclick = function() { this.classList.toggle('marked'); };
                } else {
                    tile.classList.add('empty');
                    tile.style.cursor = 'default';
                    tile.onclick = null;
                }
            });

            board.offsetHeight; // force reflow

            tiles.forEach((tile, index) => {
                const inner = tile.querySelector('.tile-inner');
                if (!inner) return;
                const delay = calculateStaggerDelay(index, tiles.length);
                setTimeout(() => {
                    inner.style.transform = '';
                    inner.style.opacity = '';
                    tile.classList.add('spiral-in');
                    setTimeout(() => { tile.classList.remove('spiral-in'); }, TIMINGS.spiralInDuration);
                }, delay);
            });

            isBuilding = false;
        }

        // ============================================================
        // INITIALIZATION
        // ============================================================
        async function initBoard() {
            syncIconsBtn();
            renderPlaceholders();
            await populateBoard();
        }

        initBoard();
    </script>
</body>
