<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puer Aeternus Bingo</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%22-.15em%22 y=%22.9em%22 font-size=%2290%22>🎭</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            padding-top: 80px;
        }

        h1 {
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            position: relative;
        }

        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.95);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 150px;
        }

        .controls h3 {
            margin: 0;
            font-size: 14px;
            color: #2c3e50;
            text-align: center;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .control-btn {
            background: #3498db;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            background: #2980b9;
            transform: scale(1.1);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .item-count {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
            min-width: 40px;
            text-align: center;
        }

        .shuffle-btn {
            display: inline-flex;
            align-items: center;
            justify-content: space-evenly;
            background: #27ae60;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .shuffle-btn > :nth-child(odd) {
            font-size: large;
        }

        .shuffle-btn:hover {
            background: #229954;
            transform: translateY(-1px);
        }

        .shuffle-btn:active {
            transform: translateY(0);
        }

        .bingo-container {
            display: grid;
            gap: 10px;
            max-width: 800px;
            min-width: 0;
            width: 100%;
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
        }

        .bingo-tile {
            aspect-ratio: 1;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            user-select: none;
            position: relative;
            min-width: 0;
            min-height: 0;
            perspective: 1000px;
        }

        .tile-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform var(--flip-duration);
            transform-style: preserve-3d;
        }

        .bingo-tile.marked .tile-inner {
            transform: rotateY(180deg);
        }

        .tile-front, .tile-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            word-wrap: break-word;
            overflow: hidden;
        }

        .tile-front {
            background: white;
            border: 3px solid #3498db;
            color: #333;
        }

        .tile-back {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
            border: 3px solid #229954;
            color: white;
            transform: rotateY(180deg);
        }

        .tile-emoji {
            position: absolute;
            top: var(--icon-top-offset);
            left: 0;
            right: 0;
            height: var(--icon-window-height);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--icon-size);
            opacity: 1;
            filter: none;
            pointer-events: none;
            user-select: none;
            z-index: 0;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.1);
            border-radius: 7px 7px 0 0;
        }

        .tile-text {
            position: absolute;
            top: calc(var(--icon-window-height) + var(--text-top-offset));
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-family: var(--text-font);
            z-index: 1;
        }

        .tile-back .tile-text {
            text-shadow: 
                0 0 var(--text-shadow-blur-1) rgba(0, 0, 0, var(--text-shadow-opacity-1)),
                0 0 var(--text-shadow-blur-2) rgba(0, 0, 0, var(--text-shadow-opacity-2)),
                0 0 var(--text-shadow-blur-3) rgba(0, 0, 0, var(--text-shadow-opacity-3));
        }
        
        .tile-front .tile-text {
            position: relative;
            top: auto;
            left: auto;
            right: auto;
            bottom: auto;
            font-family: var(--text-font);
        }

        .bingo-tile.empty .tile-front,
        .bingo-tile.empty .tile-back {
            background: #7c8894;
            border: 3px dashed #5b6a75;
        }

        .bingo-tile.placeholder {
            pointer-events: none;
        }

        .bingo-tile.placeholder .tile-inner {
            background: transparent;
            border-radius: 10px;
            border: none;
        }

        .bingo-tile:not(.empty):hover .tile-inner {
            transform: rotateY(15deg);
            box-shadow: 0 6px 18px rgba(0,0,0,0.25);
        }

        .bingo-tile.marked:not(.empty):hover .tile-inner {
            transform: rotateY(165deg);
        }

        @keyframes spiralIn {
            0% {
                transform: scale(0) rotate(-360deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .bingo-tile.spiral-in .tile-inner {
            animation: spiralIn var(--spiral-in-duration) ease-out;
        }

        /* CHAOTIC DESTRUCTION PARTICLES */
        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 1000;
        }

        .particle.chaos {
            background: var(--particle-color);
            box-shadow: 0 0 3px var(--particle-glow);
        }

        @keyframes violentDestruction {
            0% {
                transform: translate(var(--start-x), var(--start-y)) 
                           scale(var(--start-scale)) 
                           rotateX(var(--rot-x-start)) 
                           rotateY(var(--rot-y-start)) 
                           rotateZ(var(--rot-z-start));
                opacity: var(--start-opacity);
            }
            100% {
                transform: translate(var(--end-x), var(--end-y)) 
                           scale(0) 
                           rotateX(var(--rot-x-end)) 
                           rotateY(var(--rot-y-end)) 
                           rotateZ(var(--rot-z-end));
                opacity: 0;
            }
        }

        .particle.chaos {
            animation: violentDestruction var(--particle-duration) var(--particle-easing) forwards;
            will-change: transform, opacity;
            backface-visibility: hidden;
        }

        .card-fragment {
            pointer-events: none;
            z-index: 1000;
            will-change: transform, opacity;
            backface-visibility: hidden;
        }

        .tile-back::before {
            content: '✓';
            position: absolute;
            top: 4px;
            right: 4px;
            width: 20px;
            height: 20px;
            background: rgba(70, 70, 70, 0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }

        .line-number {
            position: absolute;
            bottom: 3px;
            left: 3px;
            min-width: 28px;
            background: rgba(70, 70, 70, 0.25);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px 6px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 12px;
            font-weight: normal;
            font-family: monospace;
        }

        @media (max-width: 600px) {
            .bingo-tile {
                font-size: 11px;
            }

            .tile-front, .tile-back {
                padding: 5px;
            }

            .bingo-container {
                gap: 5px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="controls">
        <h3>Items to Use</h3>
        <div class="control-row">
            <button class="control-btn" onclick="decreaseItems()">-</button>
            <span class="item-count" id="itemCount">25</span>
            <button class="control-btn" onclick="increaseItems()">+</button>
        </div>
        <button class="shuffle-btn" onclick="shuffleBoard()"><span>🔀</span><span>Shuffle</span></button>
    </div>
    
    <h1>🎭 Puer Aeternus Bingo</h1>
    <div class="bingo-container" id="bingoBoard"></div>
    
    <div id="particleSandbox" style="position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 9999;"></div>

    <script>
        // ============================================================
        // MASTER CONFIGURATION - Everything in one place, capisce?
        // ============================================================
        const TIMINGS = {
            flipDuration: 600,
            minRipDuration: 1000,
            maxRipDuration: 1200,
            spiralInDuration: 500,
            flipbackWait: 300,
            maxStaggerDelay: 200,
            debounceDelay: 100,
            minPlaceholderDisplay: 500
        };

        const PARTICLE_CONFIG = {
            chaos: {
                count: 30,
                minSize: 4,
                maxSize: 8,
                minDuration: 500,
                maxDuration: 1050,
                maxStartDelay: 100,
                spawnRadiusMultiplier: 0.85,
                angleVariationRad: 0.8,
                overshootMinMult: 0.5,
                overshootMaxMult: 4,
                rotationMin: -720,
                rotationMax: 720,
                startScaleMin: 0.7,
                startScaleMax: 1.3,
                startOpacityMin: 0.7,
                startOpacityMax: 1.0,
                colors: [
                    { bg: 'rgba(20, 20, 35, 0.9)', glow: 'rgba(40, 40, 80, 0.5)' },
                    { bg: 'rgba(30, 25, 40, 0.85)', glow: 'rgba(50, 40, 70, 0.4)' },
                    { bg: 'rgba(15, 15, 25, 0.95)', glow: 'rgba(30, 30, 50, 0.6)' },
                    { bg: 'rgba(25, 20, 45, 0.8)', glow: 'rgba(60, 50, 90, 0.3)' },
                    { bg: 'rgba(40, 50, 80, 0.7)', glow: 'rgba(70, 90, 130, 0.4)' }
                ],
                easingFunctions: ['ease-in', 'ease-out', 'linear', 'ease-in-out']
            }
        };
        
        const CARD_STYLE = {
            // Icon/emoji settings
            iconSize: 50,              // Font size in px
            iconTopOffset: 0,          // % from top of card (0 = at top)
            iconWindowHeight: 28,      // % of card height for icon area
            
            // Text settings
            textTopOffset: 0,          // % offset from default position (0 = centered in remaining space)
            textFont: 'Arial, sans-serif',
            
            // Text shadow (for back of card only)
            textShadowBlur1: 20,       // First layer blur radius
            textShadowBlur2: 30,       // Second layer blur radius
            textShadowBlur3: 40,       // Third layer blur radius
            textShadowOpacity1: 0.9,   // First layer opacity
            textShadowOpacity2: 0.8,   // Second layer opacity
            textShadowOpacity3: 0.7    // Third layer opacity
        };
        
        const RIP_CONFIG = {
            jitter: 15,
            edgeRoughness: {
                extraPointsPerEdge: 2,
                maxDeviationPx: 0.9
            },
            vortex: {
                spiralDirection: 1,
                // Fragment rotation speed RELATIVE to orbital motion (degrees per second)
                // 0 = maintains orientation toward center as it orbits (natural)
                // Positive = spins faster than orbit (spins "with" the vortex)
                // Negative = spins slower than orbit (spins "against" the vortex)
                relativeRotationSpeedMin: -30,
                relativeRotationSpeedMax: 70,
                fragmentRotationVariation: 30,
                
                // Spiral/orbital speed (revolutions per second around center)
                orbitalSpeedMin: 0.7,
                orbitalSpeedMax: 1.0,
                fragmentOrbitVariation: 0.17,
                
                // Don't go ALL the way to center - leave a gap
                centerGapPercent: 0.2,

                opacityStart: 0.15, // when to start fading (0=start, 1=end)

                // Acceleration curve - controls how fast it speeds up
                // 1 = linear (constant speed)
                // 2 = quadratic (gentle acceleration)
                // 3 = cubic (strong acceleration)
                // 1.5 = sweet spot between gentle and strong
                easePower: 2.3,
                
                // Number of keyframes for smooth spiral
                spiralKeyframes: 20,
            }
        };

        function initCSSVariables() {
            const root = document.documentElement;
            
            // Timing variables
            root.style.setProperty('--flip-duration', `${TIMINGS.flipDuration}ms`);
            root.style.setProperty('--rip-duration', `${TIMINGS.maxRipDuration}ms`);
            root.style.setProperty('--spiral-in-duration', `${TIMINGS.spiralInDuration}ms`);
            
            // Card style variables
            root.style.setProperty('--icon-size', `${CARD_STYLE.iconSize}px`);
            root.style.setProperty('--icon-top-offset', `${CARD_STYLE.iconTopOffset}%`);
            root.style.setProperty('--icon-window-height', `${CARD_STYLE.iconWindowHeight}%`);
            root.style.setProperty('--text-top-offset', `${CARD_STYLE.textTopOffset}%`);
            root.style.setProperty('--text-font', CARD_STYLE.textFont);
            root.style.setProperty('--text-shadow-blur-1', `${CARD_STYLE.textShadowBlur1}px`);
            root.style.setProperty('--text-shadow-blur-2', `${CARD_STYLE.textShadowBlur2}px`);
            root.style.setProperty('--text-shadow-blur-3', `${CARD_STYLE.textShadowBlur3}px`);
            root.style.setProperty('--text-shadow-opacity-1', CARD_STYLE.textShadowOpacity1);
            root.style.setProperty('--text-shadow-opacity-2', CARD_STYLE.textShadowOpacity2);
            root.style.setProperty('--text-shadow-opacity-3', CARD_STYLE.textShadowOpacity3);
        }

        window.TIMINGS = TIMINGS;
        window.PARTICLE_CONFIG = PARTICLE_CONFIG;
        window.CARD_STYLE = CARD_STYLE;
        window.refreshCSSTimings = initCSSVariables;
        initCSSVariables();

        const DEFAULT_ITEMS = `[
["Untapped potential", "💎"],
["Just keeping it casual (forever)", "🎭"],
["Not ready for serious yet", "🚫"],
["I need my freedom", "🦅"],
["Planning feels like progress", "📋"],
["Rejects interaction with NPC", "🎮"],
["Quit when it gets hard", "🏃"],
["If it's not perfect, why bother", "👑"],
["Chronic restlessness", "🌊"],
["Guilt because low productivity", "⚖️"],
["I should be doing more", "📈"],
["Starting new hobby", "🎨"],
["Need to learn X before starting Y", "📚"],
["Escape into fantasy", "🌙"],
["Daydreaming precludes action", "☁️"],
["Finding the dealbreaker (always)", "🔍"],
["Spiritual growth over worldly success", "🧘"],
["9-5 is a prison", "⛓️"],
["My situation is uniquely complex", "❄️"],
["Normal advice doesn't apply to me", "🎪"],
["No one really gets me", "🎭"],
["Keeping my options open", "🚪"],
["External validation dependency", "👏"],
["This is beneath me", "🗑️"],
["Everyone's ahead of me", "🏁"],
["I'm falling behind", "⏰"],
["People will be looking at me critically", "👁️"],
["Rather fail spectacularly than succeed ordinarily", "💥"],
["My real life hasn't started yet", "⏸️"],
["I could do that if I wanted to", "💭"],
["What if something better comes along?", "🎰"],
["I need to make a move soon", "♟️"],
["Overthinking social encounter (with ChatGPT)", "🤖"],
["Real life is like a video game (clear right/wrong)", "🎮"],
["Recap without mentioning feelings", "📊"],
["Problem solving by looking at facts", "🔬"]
]`;

        let currentItemCount = 25;
        let availableItems = [];
        let rebuildTimeout = null;
        let isBuilding = false;
        let itemsLoadedOnce = false;

        // ============================================================
        // UTILITY FUNCTIONS
        // ============================================================

        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getNextSquare(num) {
            const sqrt = Math.ceil(Math.sqrt(num));
            return sqrt * sqrt;
        }

        function calculateStaggerDelay(index, totalTiles) {
            return Math.floor(((index + 1) / totalTiles) * TIMINGS.maxStaggerDelay);
        }

        function randomInRange(min, max) {
            return min + Math.random() * (max - min);
        }

        function pointsToPolygon(points) {
            return `polygon(${points.map(p => `${p.x}% ${p.y}%`).join(', ')})`;
        }

        function rotatePoint(point, angleDeg, cardCenterX = 50, cardCenterY = 50) {
            const angleRad = (angleDeg * Math.PI) / 180;
            const cos = Math.cos(angleRad);
            const sin = Math.sin(angleRad);
            
            // Translate to origin (relative to card's geometric center)
            const x = point.x - cardCenterX;
            const y = point.y - cardCenterY;
            
            // Rotate
            const xRot = x * cos - y * sin;
            const yRot = x * sin + y * cos;
            
            // Translate back
            return {
                x: xRot + cardCenterX,
                y: yRot + cardCenterY
            };
        }

        function calculatePolygonCentroid(points) {
            if (points.length < 3) {
                console.warn('using fallback centroid');
                return { x: 50, y: 50 };
            }
            
            let area = 0;
            let cx = 0;
            let cy = 0;
            
            for (let i = 0; i < points.length; i++) {
                const j = (i + 1) % points.length;
                const cross = points[i].x * points[j].y - points[j].x * points[i].y;
                area += cross;
                cx += (points[i].x + points[j].x) * cross;
                cy += (points[i].y + points[j].y) * cross;
            }
            
            area *= 0.5;
            cx /= (6 * area);
            cy /= (6 * area);
            
            return { x: cx, y: cy };
        }

        /**
         * Create torn paper effect by adding jagged points along edges.
         */
        function roughenEdges(points) {
            const config = RIP_CONFIG.edgeRoughness;

            if (config.extraPointsPerEdge < 1) {
                return points;
            }
    
            const roughPoints = [];
            
            for (let i = 0; i < points.length; i++) {
                const current = points[i];
                const next = points[(i + 1) % points.length];
                
                roughPoints.push(current);
                
                for (let j = 1; j <= config.extraPointsPerEdge; j++) {
                    const t = j / (config.extraPointsPerEdge + 1);
                    
                    // Linear interpolation for the base point
                    const interpX = current.x + (next.x - current.x) * t;
                    const interpY = current.y + (next.y - current.y) * t;
                    
                    const dx = next.x - current.x;
                    const dy = next.y - current.y;
                    const len = Math.sqrt(dx * dx + dy * dy);
                    
                    if (len > 0) {
                        // Unit perpendicular vector (length = 1 pixel)
                        const perpX = -dy / len;
                        const perpY = dx / len;
                        
                        const offset = randomInRange(-config.maxDeviationPx, config.maxDeviationPx);
                        
                        roughPoints.push({
                            x: interpX + (perpX * offset),
                            y: interpY + (perpY * offset)
                        });
                    }
                }
            }
            
            return roughPoints;
        }
        
        // ============================================================
        // CARD RIPPING EFFECT - Trifold tear from center
        // ============================================================
        function createCardRip(tile) {
            const rect = tile.getBoundingClientRect();
            const sandbox = document.getElementById('particleSandbox');
            
            const isFlipped = tile.classList.contains('marked');
            const sourceElement = isFlipped ? 
                tile.querySelector('.tile-back') : 
                tile.querySelector('.tile-front');
            
            if (!sourceElement) return;
            
            tile.style.opacity = '0';
            
            // Get fragment geometry
            const fragmentGeometry = generateFragmentGeometry();
            
            // Create fragments
            const fragments = fragmentGeometry.map(({ points }) => {
                const fragment = createFragment(sourceElement, rect, isFlipped);
                // Apply torn edge roughness for realistic paper tear effect
                const roughPoints = roughenEdges(points);
                fragment.style.clipPath = pointsToPolygon(roughPoints);
                return fragment;
            });
            
            const cardCenterX = rect.left + rect.width / 2;
            const cardCenterY = rect.top + rect.height / 2;
            
            // Animate each fragment with vortex effect
            fragmentGeometry.forEach(({ centroid }, index) => {
                const fragment = fragments[index];
                const { keyframes, duration } = animateVortex(fragment, rect, centroid, cardCenterX, cardCenterY);
                
                sandbox.appendChild(fragment);
                
                requestAnimationFrame(() => {
                    fragment.animate(keyframes, {
                        duration: duration,
                        easing: 'cubic-bezier(0.25, 0.1, 0.25, 1)',
                        fill: 'forwards'
                    });
                });
            });
            
            setTimeout(() => {
                fragments.forEach(f => f.remove());
            }, TIMINGS.maxRipDuration);
        }

        // ============================================================
        // FRAGMENT GEOMETRY - Sacred geometry, capisce?
        // ============================================================
        function generateFragmentGeometry() {
            const jitter = RIP_CONFIG.jitter;
            
            const rotations = [0, 90, 180, 270];
            const rotation = rotations[Math.floor(Math.random() * rotations.length)];
            
            // Generate the cut points with randomization
            const tlX = randomInRange(-jitter, jitter);
            const tlY = randomInRange(-jitter, jitter);
            const trX = 100 + randomInRange(-jitter, jitter);
            const trY = randomInRange(-jitter, jitter);
            const ripCenterX = 50 + randomInRange(-jitter, jitter);
            const ripCenterY = 66.666 + randomInRange(-jitter, jitter);
            const bcX = 50 + randomInRange(-jitter, jitter);
            const bcY = 100;
            
            // Three fragments - left, right, top (BEFORE rotation)
            const fragment1PointsBase = [
                { x: 0, y: 0 },
                { x: tlX, y: tlY },
                { x: ripCenterX, y: ripCenterY },
                { x: bcX, y: bcY },
                { x: 0, y: 100 }
            ];
            
            const fragment2PointsBase = [
                { x: ripCenterX, y: ripCenterY },
                { x: trX, y: trY },
                { x: 100, y: 0 },
                { x: 100, y: 100 },
                { x: bcX, y: bcY }
            ];
            
            const fragment3PointsBase = [
                { x: 0, y: 0 },
                { x: tlX, y: tlY },
                { x: ripCenterX, y: ripCenterY },
                { x: trX, y: trY },
                { x: 100, y: 0 }
            ];
            
            // NOW rotate 'em all by the chosen angle around the CARD CENTER (50, 50)
            const fragment1Points = fragment1PointsBase.map(p => rotatePoint(p, rotation));
            const fragment2Points = fragment2PointsBase.map(p => rotatePoint(p, rotation));
            const fragment3Points = fragment3PointsBase.map(p => rotatePoint(p, rotation));
            
            return [
                { points: fragment1Points, centroid: calculatePolygonCentroid(fragment1Points) },
                { points: fragment2Points, centroid: calculatePolygonCentroid(fragment2Points) },
                { points: fragment3Points, centroid: calculatePolygonCentroid(fragment3Points) }
            ];
        }

        // ============================================================
        // VORTEX ANIMATOR - Destruction only, one direction, professional
        // ============================================================
        function animateVortex(fragment, rect, centroid, cardCenterX, cardCenterY) {
            const vortex = RIP_CONFIG.vortex;
            const fragmentDuration = randomInRange(TIMINGS.minRipDuration, TIMINGS.maxRipDuration);
            const durationInSeconds = fragmentDuration / 1000;
            
            // Transform origin is THE CENTROID
            fragment.style.transformOrigin = `${centroid.x}% ${centroid.y}%`;
            
            // Calculate where the fragment's centroid actually IS in screen coords
            const fragmentCenterX = rect.left + (rect.width * centroid.x / 100);
            const fragmentCenterY = rect.top + (rect.height * centroid.y / 100);
            
            // Vector from fragment to card center
            const toCenterX = cardCenterX - fragmentCenterX;
            const toCenterY = cardCenterY - fragmentCenterY;
            const distance = Math.sqrt(toCenterX * toCenterX + toCenterY * toCenterY);
            
            // Starting angle - where the fragment IS relative to center
            const startAngle = Math.atan2(-toCenterY, -toCenterX);
            
            // Calculate motion based on speed and duration
            const cardOrbitalSpeed = randomInRange(vortex.orbitalSpeedMin, vortex.orbitalSpeedMax);
            const orbitalSpeed = cardOrbitalSpeed + randomInRange(-vortex.fragmentOrbitVariation, vortex.fragmentOrbitVariation);
            const totalRevolutions = orbitalSpeed * durationInSeconds;
            const totalRotation = totalRevolutions * Math.PI * 2 * vortex.spiralDirection;
            
            // Don't go all the way to center - leave a gap
            const finalDistance = distance * vortex.centerGapPercent;
            
            // Rotation relative to the spiral
            const naturalRotationSpeed = orbitalSpeed * 360 * vortex.spiralDirection;
            const cardRelativeRotationSpeed = randomInRange(vortex.relativeRotationSpeedMin, vortex.relativeRotationSpeedMax);
            const relativeRotationSpeed = cardRelativeRotationSpeed + randomInRange(-vortex.fragmentRotationVariation, vortex.fragmentRotationVariation);
                
            // Total rotation = natural (to maintain orientation) + relative (extra spin)
            const actualRotationSpeed = naturalRotationSpeed + relativeRotationSpeed;
            const totalFragmentSpin = actualRotationSpeed * durationInSeconds;
            
            // Generate keyframes along spiral path
            const keyframes = [];
            const numSteps = vortex.spiralKeyframes;
            const easeIn = (t) => Math.pow(t, vortex.easePower);
            
            for (let i = 0; i <= numSteps; i++) {
                const t = i / numSteps;  // 0 to 1, linear progression through time
                const t_eased = easeIn(t);  // 0 to 1, but ACCELERATING
                
                const currentDistance = distance - (distance - finalDistance) * t_eased;
                const currentAngle = startAngle + totalRotation * t_eased;
                
                // Convert polar to cartesian (relative to CARD center)
                const x_card = Math.cos(currentAngle) * currentDistance;
                const y_card = Math.sin(currentAngle) * currentDistance;
                    
                // Convert to fragment-centered coordinates - THIS IS THE KEY!
                const x = x_card + toCenterX;
                const y = y_card + toCenterY;
                
                const currentRotation = totalFragmentSpin * t_eased;
                const currentScale = 1 - t_eased;
                
                // Opacity fade
                let currentOpacity = 1;
                if (t_eased > vortex.opacityStart) {
                    const fadeProgress = (t_eased - vortex.opacityStart) / (1 - vortex.opacityStart);
                    currentOpacity = 1 - fadeProgress;
                }
                
                keyframes.push({
                    transform: `translate(${x}px, ${y}px) rotate(${currentRotation}deg) scale(${currentScale})`,
                    opacity: currentOpacity
                });
            }
            
            return { keyframes, duration: fragmentDuration };
        }
        
        function createFragment(sourceElement, rect, isFlipped) {
            const fragment = document.createElement('div');
            fragment.className = 'card-fragment';
            
            const computedStyle = window.getComputedStyle(sourceElement);
            fragment.style.position = 'absolute';
            fragment.style.left = rect.left + 'px';
            fragment.style.top = rect.top + 'px';
            fragment.style.width = rect.width + 'px';
            fragment.style.height = rect.height + 'px';
            fragment.style.background = computedStyle.background;
            fragment.style.border = computedStyle.border;
            fragment.style.borderRadius = computedStyle.borderRadius;
            fragment.style.color = computedStyle.color;
            fragment.style.fontSize = computedStyle.fontSize;
            fragment.style.fontWeight = computedStyle.fontWeight;
            fragment.style.display = 'flex';
            fragment.style.alignItems = 'center';
            fragment.style.justifyContent = 'center';
            fragment.style.textAlign = 'center';
            fragment.style.padding = computedStyle.padding;
            
            // Clone the emoji and text structure
            fragment.innerHTML = sourceElement.innerHTML;
                        
            return fragment;
        }

        // ============================================================
        // CHAOTIC DESTRUCTION PARTICLE SYSTEM
        // ============================================================
        function createChaoticDestruction(tile) {
            const rect = tile.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const tileSize = Math.min(rect.width, rect.height);
            const config = PARTICLE_CONFIG.chaos;
            
            const particles = [];
            const spawnRadius = tileSize * config.spawnRadiusMultiplier;
            const sandbox = document.getElementById('particleSandbox');
            
            const maxParticleLifetime = config.maxStartDelay + config.maxDuration;
            
            for (let i = 0; i < config.count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle chaos';
                
                const size = randomInRange(config.minSize, config.maxSize);
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                const colorData = config.colors[Math.floor(Math.random() * config.colors.length)];
                particle.style.setProperty('--particle-color', colorData.bg);
                particle.style.setProperty('--particle-glow', colorData.glow);
                
                const angle = Math.random() * Math.PI * 2;
                const spawnDist = spawnRadius * randomInRange(0.3, 1.0);
                const startX = Math.cos(angle) * spawnDist;
                const startY = Math.sin(angle) * spawnDist;
                
                const targetAngle = angle + (Math.random() - 0.5) * Math.PI * config.angleVariationRad;
                const overshoot = randomInRange(config.overshootMinMult, config.overshootMaxMult);
                const endDist = -spawnDist * overshoot;
                const endX = Math.cos(targetAngle) * endDist;
                const endY = Math.sin(targetAngle) * endDist;
                
                const rotXStart = Math.random() * 360;
                const rotYStart = Math.random() * 360;
                const rotZStart = Math.random() * 360;
                const rotXEnd = rotXStart + randomInRange(config.rotationMin, config.rotationMax);
                const rotYEnd = rotYStart + randomInRange(config.rotationMin, config.rotationMax);
                const rotZEnd = rotZStart + randomInRange(config.rotationMin, config.rotationMax);
                
                const duration = randomInRange(config.minDuration, config.maxDuration);
                const easing = config.easingFunctions[Math.floor(Math.random() * config.easingFunctions.length)];
                const startScale = randomInRange(config.startScaleMin, config.startScaleMax);
                const startOpacity = randomInRange(config.startOpacityMin, config.startOpacityMax);
                
                particle.style.left = `${centerX}px`;
                particle.style.top = `${centerY}px`;
                particle.style.setProperty('--start-x', `${startX}px`);
                particle.style.setProperty('--start-y', `${startY}px`);
                particle.style.setProperty('--end-x', `${endX}px`);
                particle.style.setProperty('--end-y', `${endY}px`);
                particle.style.setProperty('--rot-x-start', `${rotXStart}deg`);
                particle.style.setProperty('--rot-y-start', `${rotYStart}deg`);
                particle.style.setProperty('--rot-z-start', `${rotZStart}deg`);
                particle.style.setProperty('--rot-x-end', `${rotXEnd}deg`);
                particle.style.setProperty('--rot-y-end', `${rotYEnd}deg`);
                particle.style.setProperty('--rot-z-end', `${rotZEnd}deg`);
                particle.style.setProperty('--start-scale', startScale);
                particle.style.setProperty('--start-opacity', startOpacity);
                particle.style.setProperty('--particle-duration', `${duration}ms`);
                particle.style.setProperty('--particle-easing', easing);
                
                const startDelay = Math.random() * config.maxStartDelay;
                particle.style.animationDelay = `${startDelay}ms`;
                
                sandbox.appendChild(particle);
                particles.push(particle);
            }
            
            setTimeout(() => {
                particles.forEach(p => p.remove());
            }, maxParticleLifetime);
        }

        // ============================================================
        // USER INTERACTION HANDLERS
        // ============================================================

        function increaseItems() {
            if (currentItemCount < availableItems.length) {
                currentItemCount++;
                document.getElementById('itemCount').textContent = currentItemCount;
                debouncedRefresh();
            }
        }

        function decreaseItems() {
            if (currentItemCount > 1) {
                currentItemCount--;
                document.getElementById('itemCount').textContent = currentItemCount;
                debouncedRefresh();
            }
        }

        function shuffleBoard() {
            refreshBoard();
        }

        function debouncedRefresh() {
            if (rebuildTimeout) {
                clearTimeout(rebuildTimeout);
            }
            
            rebuildTimeout = setTimeout(() => {
                refreshBoard();
            }, TIMINGS.debounceDelay);
        }

        // ============================================================
        // BOARD REFRESH ANIMATION SEQUENCE
        // ============================================================

        function refreshBoard() {
            if (isBuilding) return;
            
            isBuilding = true;
            const board = document.getElementById('bingoBoard');
            const tiles = board.querySelectorAll('.bingo-tile');
            
            let hadFlippedCards = false;
            tiles.forEach(tile => {
                if (tile.classList.contains('marked')) {
                    hadFlippedCards = true;
                    tile.classList.remove('marked');
                }
            });
            
            const flipBackDelay = hadFlippedCards ? TIMINGS.flipbackWait : 0;
            setTimeout(() => {
                tiles.forEach((tile, index) => {
                    setTimeout(() => {
                        createCardRip(tile);
                        if (!tile.classList.contains('placeholder') && !tile.classList.contains('empty')) {
                            createChaoticDestruction(tile);
                        }
                    }, calculateStaggerDelay(index, tiles.length));
                });
            }, flipBackDelay);
            
            const lastTileDelay = calculateStaggerDelay(tiles.length - 1, tiles.length);
            const maxParticleLifetime = PARTICLE_CONFIG.chaos.maxStartDelay + PARTICLE_CONFIG.chaos.maxDuration;
            const maxAnimationDuration = Math.max(TIMINGS.maxRipDuration, maxParticleLifetime);
            const totalWaitTime = flipBackDelay + lastTileDelay + maxAnimationDuration;
            
            setTimeout(() => {
                renderPlaceholders();
                
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        populateBoard();
                    });
                });
            }, totalWaitTime);
        }

        // ============================================================
        // BOARD RENDERING
        // ============================================================

        async function loadItemsOnce() {
            if (itemsLoadedOnce) {
                return;
            }
            
            let source = 'default items';
            let jsonData = DEFAULT_ITEMS;
            
            try {
                const response = await fetch('items.json');
                if (response.ok) {
                    const text = await response.text();
                    if (text.trim().length > 0) {
                        jsonData = text;
                        source = 'items.json';
                    }
                }
            } catch (error) {
                // Use default
            }
            
            try {
                const parsed = JSON.parse(jsonData);
                availableItems = parsed.map((item, index) => ({
                    text: item[0],
                    emoji: item[1],
                    lineNumber: index + 1
                }));
            } catch (error) {
                console.error('Failed to parse items JSON:', error);
                availableItems = [];
            }
            
            itemsLoadedOnce = true;
            console.log(`Loaded ${availableItems.length} items from ${source}`);
        }

        function renderPlaceholders() {
            const board = document.getElementById('bingoBoard');
            
            const targetSize = getNextSquare(currentItemCount);
            const gridSize = Math.sqrt(targetSize);
            
            board.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            
            board.innerHTML = '';
            for (let i = 0; i < targetSize; i++) {
                const tile = document.createElement('div');
                tile.className = 'bingo-tile placeholder';
                const inner = document.createElement('div');
                inner.className = 'tile-inner';
                tile.appendChild(inner);
                board.appendChild(tile);
            }
        }
        
        async function populateBoard() {
            const board = document.getElementById('bingoBoard');
            const startTime = performance.now();
            
            const minAnimTime = new Promise(resolve => 
                setTimeout(resolve, TIMINGS.minPlaceholderDisplay)
            );
            
            const itemsPromise = loadItemsOnce();
            
            await Promise.all([minAnimTime, itemsPromise]);
            
            const loadTime = Math.round(performance.now() - startTime);
            console.log(`Board ready after ${loadTime}ms`);
            
            if (currentItemCount > availableItems.length) {
                currentItemCount = availableItems.length;
            }
            document.getElementById('itemCount').textContent = currentItemCount;
            
            const allItems = availableItems.slice(0, currentItemCount);
            
            const targetSize = getNextSquare(allItems.length);
            const gridSize = Math.sqrt(targetSize);
            
            const items = [...allItems];
            while (items.length < targetSize) {
                items.push({ text: '', emoji: '', lineNumber: null });
            }
            
            const shuffled = shuffle(items);
            
            const tiles = board.querySelectorAll('.bingo-tile');
            shuffled.forEach((item, index) => {
                if (tiles[index]) {
                    const tile = tiles[index];
                    tile.className = 'bingo-tile';
                    
                    const inner = document.createElement('div');
                    inner.className = 'tile-inner';
                    
                    inner.style.transform = 'scale(0) rotate(-360deg)';
                    inner.style.opacity = '0';
                    
                    const front = document.createElement('div');
                    front.className = 'tile-front';
                    
                    const frontText = document.createElement('div');
                    frontText.className = 'tile-text';
                    frontText.textContent = item.text;
                    front.appendChild(frontText);
                    
                    const back = document.createElement('div');
                    back.className = 'tile-back';
                    
                    if (item.emoji) {
                        const emojiEl = document.createElement('div');
                        emojiEl.className = 'tile-emoji';
                        emojiEl.textContent = item.emoji;
                        back.appendChild(emojiEl);
                    }
                    
                    const backText = document.createElement('div');
                    backText.className = 'tile-text';
                    backText.textContent = item.text;
                    back.appendChild(backText);
                    
                    if (item.lineNumber) {
                        const lineNum = document.createElement('div');
                        lineNum.className = 'line-number';
                        lineNum.textContent = `#${item.lineNumber}`;
                        back.appendChild(lineNum);
                    }
                    
                    inner.appendChild(front);
                    inner.appendChild(back);
                    tile.innerHTML = '';
                    tile.appendChild(inner);
                    
                    if (item.text) {
                        tile.onclick = function() {
                            this.classList.toggle('marked');
                        };
                    } else {
                        tile.classList.add('empty');
                        tile.style.cursor = 'default';
                        tile.onclick = null;
                    }
                }
            });
            
            board.offsetHeight;
            
            tiles.forEach((tile, index) => {
                const inner = tile.querySelector('.tile-inner');
                if (!inner) return;
                
                const delay = calculateStaggerDelay(index, tiles.length);
                
                setTimeout(() => {
                    inner.style.transform = '';
                    inner.style.opacity = '';
                    tile.classList.add('spiral-in');
                    
                    setTimeout(() => {
                        tile.classList.remove('spiral-in');
                    }, TIMINGS.spiralInDuration);
                }, delay);
            });
            
            isBuilding = false;
        }

        // ============================================================
        // INITIALIZATION
        // ============================================================

        async function initBoard() {
            renderPlaceholders();
            await populateBoard();
        }

        initBoard();
    </script>
